services:
  gadpamsa:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PYTORCH_CHANNEL: "cu121"
    image: gadpamsa:gpu
    volumes:
      - ../..:/workspaces/GA-DPAMSA
    working_dir: /workspaces/GA-DPAMSA
    tty: true
    stdin_open: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]